<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Neon Cyber Gradients -->
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pulse-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes radar-pulse {
      0% { r: 4px; opacity: 1; }
      50% { r: 12px; opacity: 0.2; }
      100% { r: 16px; opacity: 0; }
    }
    @keyframes border-glow {
      0%, 100% { stroke: #00F2FE; filter: drop-shadow(0 0 4px #00F2FE); }
      50% { stroke: #8B5CF6; filter: drop-shadow(0 0 7px #8B5CF6); }
    }
    @keyframes beam-sweep {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      fill: url(#text-glow);
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.4));
    }
    .hud-sub {
      font-family: "Fira Code", monospace, "SF Mono", Consolas;
      font-weight: 700;
      letter-spacing: 3.5px;
      font-size: 13px;
      fill: #38BDF8;
    }
    .hud-mono {
      font-family: "Fira Code", monospace, "SF Mono", Consolas;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #94A3B8;
    }
    .tag-box {
      fill: #0F172A;
      stroke: #1E293B;
      stroke-width: 1;
      rx: 4;
    }
    .status-badge {
      font-family: "Fira Code", monospace, "SF Mono", Consolas;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #34D399;
    }
    .scanner-beam {
      animation: scanline 7s ease-in-out infinite;
    }
    .beacon-wave {
      animation: radar-pulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Frame Background -->
  <rect width="900" height="290" rx="14" fill="url(#bg-grad)"/>
  <rect width="900" height="290" rx="14" fill="url(#cyber-grid)"/>

  <!-- Scanning Light Sweep -->
  <g clip-path="url(#border-clip)">
    <clipPath id="border-clip">
      <rect width="900" height="290" rx="14"/>
    </clipPath>
    <rect x="0" y="0" width="900" height="2" fill="url(#pulse-grad)" class="scanner-beam" opacity="0.6"/>
  </g>

  <!-- Outer Neon Frame -->
  <rect x="3" y="3" width="894" height="284" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Glowing Corner Reticles (Tactical HUD) -->
  <!-- Top-Left -->
  <path d="M 16 38 L 16 16 L 38 16" fill="none" stroke="#00F2FE" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Top-Right -->
  <path d="M 884 38 L 884 16 L 862 16" fill="none" stroke="#8B5CF6" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Bottom-Left -->
  <path d="M 16 252 L 16 274 L 38 274" fill="none" stroke="#8B5CF6" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Bottom-Right -->
  <path d="M 884 252 L 884 274 L 862 274" fill="none" stroke="#00F2FE" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Top Status Bar -->
  <g transform="translate(42, 38)">
    <!-- Circuit Dot & ID -->
    <circle cx="6" cy="6" r="3" fill="#00F2FE" filter="url(#glow)"/>
    <text x="18" y="10" class="hud-mono" fill="#64748B">SYS_ID // AT-050 // FDE-SPEC</text>
  </g>

  <g transform="translate(620, 32)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="238" height="24" rx="12" fill="#064E3B" fill-opacity="0.35" stroke="#059669" stroke-width="1"/>
    <!-- Animated Beacon -->
    <circle cx="16" cy="12" r="8" fill="none" stroke="#34D399" stroke-width="1.5" class="beacon-wave"/>
    <circle cx="16" cy="12" r="4" fill="#10B981" filter="url(#glow)"/>
    <text x="32" y="16" class="status-badge">FORWARD DEPLOYED // READY</text>
  </g>

  <!-- Horizontal Accent Circuit Line -->
  <line x1="42" y1="56" x2="858" y2="56" stroke="#1E293B" stroke-width="1"/>
  <line x1="42" y1="56" x2="240" y2="56" stroke="#00F2FE" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="240" cy="56" r="2.5" fill="#00F2FE"/>

  <!-- Main Hero Titles -->
  <g transform="translate(42, 116)">
    <text x="0" y="0" class="hud-title" font-size="44">ABHISHEK TIWARI</text>
    <text x="2" y="32" class="hud-sub">FORWARD DEPLOYED ENGINEER // AGENTIC SYSTEMS ARCHITECT</text>
    <text x="2" y="58" class="hud-mono">BRIDGING CUTTING-EDGE LLM ORCHESTRATION &amp; FIELD PRODUCTION FRONTLINES</text>
  </g>

  <!-- HUD Telemetry Capability Cards (Bottom Row) -->
  <!-- Card 1: Autonomous Agents -->
  <g transform="translate(42, 202)">
    <rect width="258" height="58" rx="6" class="tag-box"/>
    <line x1="0" y1="0" x2="4" y2="58" stroke="#00F2FE" stroke-width="3" filter="url(#glow)"/>
    <text x="16" y="22" class="hud-mono" font-weight="700" fill="#38BDF8">01 // AGENTIC ARCHITECTURES</text>
    <text x="16" y="42" class="hud-mono" fill="#CBD5E1">Adenhive • LangGraph • LLM Council</text>
  </g>

  <!-- Card 2: Distributed Real-Time Systems -->
  <g transform="translate(321, 202)">
    <rect width="258" height="58" rx="6" class="tag-box"/>
    <line x1="0" y1="0" x2="4" y2="58" stroke="#8B5CF6" stroke-width="3" filter="url(#glow)"/>
    <text x="16" y="22" class="hud-mono" font-weight="700" fill="#A78BFA">02 // DISTRIBUTED TELEMETRY</text>
    <text x="16" y="42" class="hud-mono" fill="#CBD5E1">FastAPI • RabbitMQ • Go Concurrency</text>
  </g>

  <!-- Card 3: Full-Stack & Native Android Frontlines -->
  <g transform="translate(600, 202)">
    <rect width="258" height="58" rx="6" class="tag-box"/>
    <line x1="0" y1="0" x2="4" y2="58" stroke="#34D399" stroke-width="3" filter="url(#glow)"/>
    <text x="16" y="22" class="hud-mono" font-weight="700" fill="#6EE7B7">03 // FRONTLINE DEPLOYMENT</text>
    <text x="16" y="42" class="hud-mono" fill="#CBD5E1">Next.js SSR • Kotlin Native • Docker</text>
  </g>

</svg>
