<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B101D"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="trace-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="trace-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pulse-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-travel-1 {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes pulse-travel-2 {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .flow-node {
      fill: #0F172A;
      stroke: #1E293B;
      stroke-width: 1.5;
      rx: 10;
    }
    .node-header {
      font-family: "Fira Code", monospace, "SF Mono", Consolas;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .node-item {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #94A3B8;
    }
    .node-code {
      font-family: "Fira Code", monospace, "SF Mono", Consolas;
      font-size: 11px;
      fill: #CBD5E1;
    }
    .circuit-path {
      fill: none;
      stroke: #1E293B;
      stroke-width: 2;
      stroke-dasharray: 4, 4;
    }
    .pulse-dot-1 {
      offset-path: path("M 270 120 L 330 120");
      animation: pulse-travel-1 2s linear infinite;
    }
    .pulse-dot-2 {
      offset-path: path("M 580 120 L 640 120");
      animation: pulse-travel-2 2s linear infinite 0.8s;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="12" fill="url(#flow-bg)"/>
  <rect x="2" y="2" width="896" height="236" rx="10" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Title Badge -->
  <g transform="translate(32, 22)">
    <circle cx="6" cy="6" r="3" fill="#00F2FE" filter="url(#neon-glow)"/>
    <text x="18" y="10" font-family="'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#38BDF8">FORWARD DEPLOYED PIPELINE // ARCHITECTURE OVERVIEW</text>
  </g>

  <!-- Connecting Bus Traces -->
  <!-- Line 1 to 2 -->
  <path d="M 270 120 L 330 120" stroke="#00F2FE" stroke-width="2" opacity="0.4"/>
  <circle r="4" fill="#00F2FE" filter="url(#pulse-blur)" class="pulse-dot-1"/>
  
  <!-- Line 2 to 3 -->
  <path d="M 580 120 L 640 120" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
  <circle r="4" fill="#8B5CF6" filter="url(#pulse-blur)" class="pulse-dot-2"/>

  <!-- NODE 1: Ingestion & Telemetry Sources -->
  <g transform="translate(30, 52)">
    <rect width="240" height="152" class="flow-node"/>
    <rect width="240" height="32" rx="10" fill="#0284C7" fill-opacity="0.12"/>
    <line x1="0" y1="32" x2="240" y2="32" stroke="#0284C7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="16" r="4" fill="#00F2FE" filter="url(#neon-glow)"/>
    <text x="30" y="20" class="node-header" fill="#38BDF8">01. INGESTION &amp; DATA</text>
    
    <text x="18" y="58" class="node-item">• Clinical Telemetry Streams</text>
    <text x="18" y="82" class="node-item">• Lossless Audio &amp; Spotify Sync</text>
    <text x="18" y="106" class="node-item">• Aviation Systems Telemetry</text>
    <text x="18" y="130" class="node-item">• Enterprise CRM &amp; Multi-PDFs</text>
  </g>

  <!-- NODE 2: Agentic Orchestration Core -->
  <g transform="translate(330, 52)">
    <rect width="250" height="152" class="flow-node" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <rect width="250" height="32" rx="10" fill="#7C3AED" fill-opacity="0.15"/>
    <line x1="0" y1="32" x2="250" y2="32" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="16" r="4" fill="#8B5CF6" filter="url(#neon-glow)"/>
    <text x="30" y="20" class="node-header" fill="#C084FC">02. AGENTIC REASONING</text>
    
    <text x="18" y="58" class="node-code" fill="#E2E8F0"><tspan fill="#A78BFA">Adenhive</tspan> Evolution Framework</text>
    <text x="18" y="82" class="node-code" fill="#E2E8F0"><tspan fill="#A78BFA">LLM Council</tspan> Multi-Model Deliberation</text>
    <text x="18" y="106" class="node-code" fill="#E2E8F0"><tspan fill="#A78BFA">Anomaly System</tspan> RabbitMQ + ML</text>
    <text x="18" y="130" class="node-code" fill="#E2E8F0"><tspan fill="#A78BFA">Local RAG</tspan> Vector Context Store</text>
  </g>

  <!-- NODE 3: Forward Deployed Frontline Deployments -->
  <g transform="translate(640, 52)">
    <rect width="230" height="152" class="flow-node" stroke="#10B981" stroke-opacity="0.5"/>
    <rect width="230" height="32" rx="10" fill="#059669" fill-opacity="0.12"/>
    <line x1="0" y1="32" x2="230" y2="32" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="16" r="4" fill="#34D399" filter="url(#neon-glow)"/>
    <text x="30" y="20" class="node-header" fill="#34D399">03. FRONTLINE IMPACT</text>
    
    <text x="18" y="58" class="node-item">• <tspan font-weight="700" fill="#F1F5F9">AI-VAYU</tspan> Aviation Ops</text>
    <text x="18" y="82" class="node-item">• <tspan font-weight="700" fill="#F1F5F9">Atify</tspan> Android Auto &amp; FLAC</text>
    <text x="18" y="106" class="node-item">• <tspan font-weight="700" fill="#F1F5F9">career-ops</tspan> Go Automation</text>
    <text x="18" y="130" class="node-item">• <tspan font-weight="700" fill="#F1F5F9">vistaarx</tspan> Next.js Enterprise</text>
  </g>

</svg>
